[package]
name = "dc-canonical"
version = "0.1.0"
edition = "2021"
description = "RFC 8785 (JCS) canonical JSON and SHA-256 digest; strict parsing (duplicate keys and lone surrogates refused)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
