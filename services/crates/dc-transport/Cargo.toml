[package]
name = "dc-transport"
version = "0.1.0"
edition = "2021"
description = "gRPC transport for SignedEnvelope; security stays in dc-envelope, the transport carries canonical bytes"

[dependencies]
dc-canonical = { path = "../dc-canonical" }
dc-contracts = { path = "../dc-contracts" }
dc-envelope = { path = "../dc-envelope" }
prost = "=0.13.5"
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "codegen", "prost"] }
tokio = { workspace = true }
serde_json = "1"

[build-dependencies]
protox = "=0.7.2"
tonic-build = { version = "=0.12.3", default-features = false, features = ["prost", "transport"] }
prost-types = "=0.13.5"
prost = "=0.13.5"

[dev-dependencies]
ed25519-dalek = "=2.1.1"
prost-types = "=0.13.5"
tokio-stream = { version = "=0.1.17", features = ["net"] }
sha2 = "0.10"
