[workspace]
members = ["crates/p0-core", "crates/p0d", "crates/owner-issuer", "crates/verifierd", "crates/dc-contracts", "crates/uacd", "crates/dc-canonical"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "=1.38.1", features = ["full"] }
axum = "=0.7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }
tokio-postgres = { version = "=0.7.11", features = ["with-serde_json-1", "with-uuid-1"] }
anyhow = "1"
